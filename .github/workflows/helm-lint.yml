name: Helm lint

on:
  pull_request:
    paths:
      - deploy/helm/**

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/lumen-server
      - run: helm template test deploy/helm/lumen-server > /dev/null