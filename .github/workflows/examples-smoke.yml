name: Example smoke tests

on:
  pull_request:
    branches: [main]

jobs:
  examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [node, nextjs, playground, session-keys, expo]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./examples/${{ matrix.example }}" run typecheck
        continue-on-error: ${{ matrix.example == 'expo' }}