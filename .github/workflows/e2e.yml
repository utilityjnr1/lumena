name: E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  e2e-browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build monorepo packages
        run: pnpm build

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium
        working-directory: packages/web-sdk

      - name: Start Stellar Quickstart container
        run: |
          docker compose -f docker/docker-compose.yml up -d stellar
          echo "Waiting for Horizon and Soroban RPC..."
          timeout 120s bash -c 'until curl -s http://localhost:8000/ > /dev/null; do sleep 2; done'
          echo "Stellar container is online!"

      - name: Run Playwright E2E Tests
        run: pnpm --filter @lumen/web-sdk test:e2e --project=chromium
        env:
          HORIZON_URL: http://localhost:8000
          RPC_URL: http://localhost:8000/rpc

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: packages/web-sdk/playwright-report/
          retention-days: 7
